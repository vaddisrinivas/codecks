name: M11 emulator DeX proxies

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/src/androidTestPlayInternal/java/io/codecks/internalquality/**"
      - "app/src/playInternal/**"
      - "scripts/run_m11_dex_proxy.sh"
      - "scripts/verify_m11_source_isolation.sh"
      - "tools/evidence/*m11*"
      - "tools/evidence/schemas/*m11*"
      - ".github/workflows/m11-dex-proxy.yml"

permissions:
  contents: read

jobs:
  emulator-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify OSS and public Play isolation
        run: ./scripts/verify_m11_source_isolation.sh
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run fail-closed emulator-only DeX proxies
        run: ./scripts/run_m11_dex_proxy.sh
      - name: Upload machine receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m11-dex-emulator-proxy
          path: |
            tasks/test-evidence/autonomous-maturity-m11-dex-proxy.json
            tasks/test-evidence/m11/runtime/
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
          if-no-files-found: error
          retention-days: 14
