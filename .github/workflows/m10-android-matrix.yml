name: M10 managed Android matrix

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "scripts/run_m10_managed_profile.sh"
      - ".github/workflows/m10-android-matrix.yml"

permissions:
  contents: read

concurrency:
  group: m10-managed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    name: M10 static guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Preserve unshrunk release and commercial-dark boundaries
        run: |
          ./scripts/verify_release_no_shrink.sh
          ./scripts/run_commercial_static_proof.sh
          ./gradlew --no-daemon :app:validateCommercialBuildBoundaries

  managed-profile:
    name: API ${{ matrix.api }} / ${{ matrix.shape }}
    needs: guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        api: [31, 32, 33, 34, 35, 36]
        shape: [compact, standard, tablet]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run isolated managed profile
        env:
          M10_ALLOW_IMAGE_DOWNLOAD: "true"
        run: ./scripts/run_m10_managed_profile.sh "${{ matrix.api }}" "${{ matrix.shape }}"
      - name: Upload profile evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m10-api-${{ matrix.api }}-${{ matrix.shape }}
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            app/build/outputs/managed_device_android_test_additional_output
            app/build/outputs/m10-image-api-*.txt
          if-no-files-found: ignore
          retention-days: 14
