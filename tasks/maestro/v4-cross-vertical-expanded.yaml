appId: app.codecks.debug
name: Expanded cross-vertical navigation
---

- launchApp:
    clearState: true

- assertVisible: "Deck"
- tapOn: "Trackpad"
- assertVisible: "Trackpad"
- tapOn: "Keyboard"
- assertVisible: "Keyboard"
- swipe:
    start: 5%, 90%
    end: 5%, 20%
    duration: 500
- assertVisible: "Settings"
- tapOn: "Settings"
- assertVisible: "Settings"
- tapOn: "Rules"
- assertVisible: "Rules"
- tapOn: "AI"
- assertVisible: "AI"

- takeScreenshot: "v4-cross-vertical-expanded-endpoint"
