appId: app.codecks.debug
name: Expanded cross-vertical navigation
---

- launchApp:
    clearState: true

- assertVisible: "Deck"
- tapOn: "Deck options"
- tapOn: "Customize on Deck"
- assertVisible: "Customize · tap a button to move"
- tapOn: "Deck options"
- tapOn: "Done customizing"
- tapOn: "Trackpad"
- assertVisible: "Trackpad"
- tapOn: "Keyboard"
- assertVisible: "Keyboard"
- swipe:
    start: 5%, 90%
    end: 5%, 20%
    duration: 500
- assertVisible: "Settings"
- tapOn: "Settings"
- assertVisible: "Settings"
- tapOn: "Rules"
- assertVisible: "Rules"
- tapOn: "AI Builder"
- assertVisible: "AI Builder"

- takeScreenshot: "v4-cross-vertical-expanded-endpoint"
