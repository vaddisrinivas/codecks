appId: app.codecks.debug
name: Compact cross-vertical navigation
---

- launchApp:
    clearState: true

- assertVisible: "Deck"
- tapOn: "Deck options"
- tapOn: "Customize on Deck"
- assertVisible: "Customize · tap a button to move"
- tapOn: "Deck options"
- assertVisible: "Done customizing"
- tapOn: "Done customizing"
- tapOn: "Trackpad"
- assertVisible: "Trackpad"
- tapOn: "Keyboard"
- assertVisible: "Keyboard"
- tapOn: "More"
- scrollUntilVisible:
    element:
      text: "Settings"
    direction: DOWN
- tapOn: "Settings"
- assertVisible: "Settings"
- tapOn: "More"
- scrollUntilVisible:
    element:
      text: "Rules"
    direction: DOWN
- tapOn: "Rules"
- assertVisible: "Rules"
- tapOn: "More"
- tapOn: "AI Builder"
- assertVisible: "AI Builder"

- takeScreenshot: "v4-cross-vertical-endpoint"
